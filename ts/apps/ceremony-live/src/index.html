<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prove an identity</title>
    <style>
      :root { font: 16px/1.5 system-ui, sans-serif; color-scheme: light dark; }
      body { max-width: 48rem; margin: 3rem auto; padding: 0 1.25rem; }
      .muted { opacity: .75; }
      dl { display: grid; grid-template-columns: 10rem 1fr; gap: .5rem; }
      dt { font-weight: 600; }
      dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, monospace; }
      .launch { font: inherit; padding: .5rem .8rem; }
      .launch { border: 1px solid currentColor; border-radius: .25rem; text-decoration: none; cursor: pointer; }
      .launch[aria-disabled="true"] { opacity: .4; pointer-events: none; }
      .actions { display: flex; gap: .75rem; margin: 1rem 0; align-items: center; }
      #status { min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <h1>Prove an identity</h1>
    <p class="muted">Prove a GitHub, X or Google account in the browser through the CCDP ceremony. Nothing is sent to a chain.</p>
    <div class="actions">
      <a id="prove-github" class="launch" href="/" aria-disabled="true">Prove GitHub</a>
      <a id="prove-x" class="launch" href="/" aria-disabled="true">Prove X</a>
      <a id="prove-google" class="launch" href="/" aria-disabled="true">Prove Google</a>
    </div>
    <p id="status" role="status" data-testid="status"></p>
    <dl>
      <dt>Stage</dt><dd data-testid="stage">—</dd>
      <dt>Account</dt><dd data-testid="user-name">—</dd>
      <dt>User ID</dt><dd data-testid="user-id">—</dd>
      <dt>Platform</dt><dd data-testid="platform">—</dd>
      <dt>Ceremony version</dt><dd data-testid="ceremony-version">—</dd>
      <dt>Attestations</dt><dd data-testid="attestations">—</dd>
      <dt>Proof bytes</dt><dd data-testid="proof-bytes">—</dd>
      <dt>Expires at</dt><dd data-testid="expires-at">—</dd>
      <dt>Outcome</dt><dd data-testid="outcome">—</dd>
    </dl>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
